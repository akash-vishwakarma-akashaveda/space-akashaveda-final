<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Akashaveda · Ground segment as a service</title>
    <meta name="description" content="Ground station passes, mission control and space safety for satellite operators: the GS-01 tri-band ground station, Vyuh mission control and Chakra SSA." />
    <meta name="theme-color" content="#0a1528" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <!-- Pre-rendered page text (scripts/seo.mjs) is for crawlers and no-JS readers; the app replaces it.
         Loader (#boot): a frosted layer over the real page. Home page: CONNECTING (satellite), CONTROLLING
         (mission control), COMPREHENDING (space safety), one at a time, each icon drawing itself as its word rises and
         each lifting away again; icons are Lucide (lucide.dev, ISC licence);
         product pages show the blur only. src/boot.ts lifts it (the blur melts away into the page) once the page
         is ready. `booting` holds page entrances until then. -->
    <script>
      (function () {
        // The home page always plays the words; product pages (reached by clicking around) just clear the blur.
        var d = document.documentElement, home = /^\/(hi\/?)?$/.test(location.pathname);
        d.classList.add('js', 'booting');
        if (!home || matchMedia('(prefers-reduced-motion: reduce)').matches) d.classList.add('boot-quick');
        window.__bootStart = performance.now();
      })();
    </script>
    <style>
      .js .seo-static { display: none }
      #boot { display: none }
      .booting { overflow: hidden }
      .js #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: rgba(3, 7, 15, 0.55); -webkit-backdrop-filter: blur(24px) saturate(120%); backdrop-filter: blur(24px) saturate(120%); transition: background 0.9s ease, -webkit-backdrop-filter 0.9s ease, backdrop-filter 0.9s ease, opacity 0.5s ease 0.6s }
      #boot > * { grid-area: 1 / 1 }
      /* The three stages, one at a time: a small gold line icon draws itself above a big bold word */
      #boot .bi { display: flex; flex-direction: column; align-items: center; gap: clamp(16px, 2.4vw, 26px); opacity: 0; animation: bi 0.95s cubic-bezier(0.16, 1, 0.3, 1) var(--d) both }
      #boot .bi svg { width: clamp(48px, 5vw, 64px); height: auto; overflow: visible; fill: none; stroke: #c9a24b; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round }
      #boot .bi svg * { stroke-dasharray: 1; stroke-dashoffset: 1; animation: bd 0.8s ease-out calc(var(--d) + 0.05s) forwards }
      #boot .bi p { margin: 0; font: 700 clamp(40px, 8vw, 112px)/0.95 'Space Grotesk', system-ui, sans-serif; letter-spacing: -0.025em; text-transform: uppercase; color: #fff; white-space: nowrap }
      #boot .bi p { position: relative }
      #boot .bi b { position: absolute; left: 100%; color: #c9a24b }
      @keyframes bi { 0% { opacity: 0; transform: translateY(40px); filter: blur(10px) } 28%, 74% { opacity: 1; transform: none; filter: none } 100% { opacity: 0; transform: translateY(-40px); filter: blur(8px) } }
      @keyframes bd { to { stroke-dashoffset: 0 } }
      .boot-quick #boot .bi { display: none }
      /* Enter: the blur melts away and the page comes into focus as the logo dissolves forward */
      #boot.out { background: rgba(3, 7, 15, 0); -webkit-backdrop-filter: blur(0) saturate(100%); backdrop-filter: blur(0) saturate(100%); opacity: 0 }
      html[lang='hi'] #boot .bi p { letter-spacing: 0; line-height: 1.3 }
      @media (prefers-reduced-motion: reduce) { #boot .bi { display: none } .js #boot { transition: opacity 0.3s } }
    </style>
    <link rel="icon" href="/brand/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="bi" style="--d: 0.15s"><svg viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M13 7 9 3 5 7l4 4"/><path pathLength="1" d="m17 11 4 4-4 4-4-4"/><path pathLength="1" d="m8 12 4 4 6-6-4-4Z"/><path pathLength="1" d="m16 8 3-3"/><path pathLength="1" d="M9 21a6 6 0 0 0-6-6"/></svg><p><span class="bt">Connecting</span><b>.</b></p></div>
      <div class="bi" style="--d: 1.1s"><svg viewBox="0 0 24 24" aria-hidden="true"><rect pathLength="1" width="7" height="9" x="3" y="3" rx="1"/><rect pathLength="1" width="7" height="5" x="14" y="3" rx="1"/><rect pathLength="1" width="7" height="9" x="14" y="12" rx="1"/><rect pathLength="1" width="7" height="5" x="3" y="16" rx="1"/></svg><p><span class="bt">Controlling</span><b>.</b></p></div>
      <div class="bi" style="--d: 2.05s"><svg viewBox="0 0 24 24" aria-hidden="true"><path pathLength="1" d="M19.07 4.93A10 10 0 0 0 6.99 3.34"/><path pathLength="1" d="M4 6h.01"/><path pathLength="1" d="M2.29 9.62A10 10 0 1 0 21.31 8.35"/><path pathLength="1" d="M16.24 7.76A6 6 0 1 0 8.23 16.67"/><path pathLength="1" d="M12 18h.01"/><path pathLength="1" d="M17.99 11.66A6 6 0 0 1 15.77 16.67"/><circle pathLength="1" cx="12" cy="12" r="2"/><path pathLength="1" d="m13.41 10.59 5.66-5.66"/></svg><p><span class="bt">Comprehending</span><b>.</b></p></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
